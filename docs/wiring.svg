<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <style>
    text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
    .title { font-size: 32px; font-weight: 700; }
    .subtitle { font-size: 20px; font-weight: 600; }
    .label { font-size: 19px; }
    .small { font-size: 16px; fill: #44506a; }
    .box { fill: #f7f9fc; stroke: #28344d; stroke-width: 3; rx: 18; }
    .pin { fill: #ffffff; stroke: #63708a; stroke-width: 2; rx: 7; }
    .note { fill: #fff7e7; stroke: #e5a52e; stroke-width: 2; rx: 12; }
    .wire { fill: none; stroke-width: 7; stroke-linecap: round; }
  </style>

  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">SEN0639 + EoRa-S3-400TB 空中端接线</text>

  <rect x="55" y="105" width="330" height="365" class="box"/>
  <text x="220" y="150" text-anchor="middle" class="subtitle">SEN0639 / PAV3015</text>
  <text x="220" y="180" text-anchor="middle" class="small">以 PCB 丝印为准，不要只看线色</text>

  <rect x="265" y="215" width="100" height="45" class="pin"/>
  <rect x="265" y="280" width="100" height="45" class="pin"/>
  <rect x="265" y="345" width="100" height="45" class="pin"/>
  <rect x="265" y="410" width="100" height="45" class="pin"/>
  <text x="315" y="244" text-anchor="middle" class="label">VCC</text>
  <text x="315" y="309" text-anchor="middle" class="label">GND</text>
  <text x="315" y="374" text-anchor="middle" class="label">SDA</text>
  <text x="315" y="439" text-anchor="middle" class="label">SCL</text>

  <rect x="765" y="90" width="380" height="395" class="box"/>
  <text x="955" y="135" text-anchor="middle" class="subtitle">EoRa-S3-400TB</text>
  <text x="955" y="165" text-anchor="middle" class="small">ESP32-S3 + E22-400MM22S / SX1268</text>

  <rect x="785" y="215" width="190" height="45" class="pin"/>
  <rect x="785" y="280" width="190" height="45" class="pin"/>
  <rect x="785" y="345" width="190" height="45" class="pin"/>
  <rect x="785" y="410" width="190" height="45" class="pin"/>
  <text x="880" y="244" text-anchor="middle" class="label">VDD（3.3 V 输出）</text>
  <text x="880" y="309" text-anchor="middle" class="label">GND</text>
  <text x="880" y="374" text-anchor="middle" class="label">GPIO41 / SDA</text>
  <text x="880" y="439" text-anchor="middle" class="label">GPIO42 / SCL</text>

  <path d="M365 237 C500 237, 650 237, 785 237" class="wire" stroke="#e33e32"/>
  <path d="M365 302 C500 302, 650 302, 785 302" class="wire" stroke="#222222"/>
  <path d="M365 367 C500 367, 650 367, 785 367" class="wire" stroke="#2985db"/>
  <path d="M365 432 C500 432, 650 432, 785 432" class="wire" stroke="#35a35a"/>

  <rect x="55" y="535" width="1090" height="135" class="note"/>
  <text x="85" y="574" class="subtitle">三节 AA 供电（接 USB-C 输入，不接 VDD，也不接锂电池座）</text>
  <text x="85" y="615" class="label">3×AA 正极  →  开关  →  可选 SS14 防反接  →  USB-C VBUS</text>
  <text x="85" y="650" class="label">3×AA 负极  ───────────────────────→  USB-C GND</text>

  <text x="1020" y="202" text-anchor="middle" class="small">先接 410–493 MHz 天线再上电</text>
</svg>
