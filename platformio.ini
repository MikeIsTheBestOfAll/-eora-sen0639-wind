[platformio]
default_envs = wind_tx_realtime, wind_tx_test, wind_tx, wind_rx
boards_dir = boards

[env]
platform = espressif32@6.6.0
board = EoRa_PI_V1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    default
    esp32_exception_decoder
lib_ldf_mode = chain+
lib_deps =
    jgromes/RadioLib@6.0.0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

[env:wind_tx_realtime]
build_src_filter =
    -<*>
    +<tx/>
build_flags =
    ${env.build_flags}
    -DREALTIME_MODE=1
    -DCOMMISSIONING_MODE=0

[env:wind_tx_test]
build_src_filter =
    -<*>
    +<tx/>
build_flags =
    ${env.build_flags}
    -DREALTIME_MODE=0
    -DCOMMISSIONING_MODE=1

[env:wind_tx]
build_src_filter =
    -<*>
    +<tx/>
build_flags =
    ${env.build_flags}
    -DREALTIME_MODE=0
    -DCOMMISSIONING_MODE=0

[env:wind_rx]
build_src_filter =
    -<*>
    +<rx/>
lib_deps =
    ${env.lib_deps}
    olikraus/U8g2@2.34.22
